<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Pop Archive - Responsive</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --accent: #ff4081; --bg: #0b0b0b; --card: #181818; --text: #ffffff; --error: #ff4d4d; }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            transition: cursor 0.3s;
        }
        
        body.hide-cursor { cursor: none !important; }

        header { 
            padding: 12px 20px; 
            background: #1a1a1a; 
            border-bottom: 2px solid var(--accent); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-shrink: 0; 
        }

        .main-container { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
            flex-direction: row; /* Standaard opzij voor PC */
        }
        
        /* Zijbalken */
        #sidebar, #playlist { 
            background: #141414; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0; 
            overflow-y: auto; 
        }

        #sidebar { width: 240px; border-right: 1px solid #333; }
        #playlist { width: 320px; border-left: 1px solid #333; }

        /* Video Zone */
        #video-zone { 
            flex: 3; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            background: #0b0b0b; 
            overflow-y: auto;
        }

        .video-box { 
            width: 100%; 
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            position: relative; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
        }

        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #error-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 10; text-align: center; 
        }

        /* Info & Controls */
        .video-controls { margin-top: 15px; display: flex; gap: 10px; align-items: stretch; }
        #video-titel-veld { 
            flex: 1; font-size: 1.1em; font-weight: bold; padding: 12px; 
            background: var(--card); border-radius: 8px; border-left: 5px solid var(--accent); 
        }
        
        .skip-btn { 
            background: var(--accent); color: white; border: none; padding: 0 20px; 
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; 
        }

        /* Items indeling */
        .lib-item, .v-item { 
            padding: 10px; margin-bottom: 5px; background: #222; 
            border-radius: 6px; cursor: pointer; font-size: 0.85em; 
        }
        .v-item { display: flex; align-items: center; gap: 10px; }
        .v-item.active { background: #2a1a20; border-left: 4px solid var(--accent); color: var(--accent); }
        .thumb { width: 80px; aspect-ratio: 16/9; border-radius: 4px; object-fit: cover; }

        .btn-upload { 
            background: var(--accent); color: white; padding: 12px; 
            border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; display: block; 
        }

        /* --- TELEFOON AANPASSINGEN (RESPONSIVE) --- */
        @media (max-width: 900px) {
            body { overflow-y: auto; height: auto; }
            header { padding: 10px; }
            .main-container { flex-direction: column; overflow: visible; }
            
            #sidebar, #playlist, #video-zone { 
                width: auto; 
                flex: none; 
                border: none; 
                overflow: visible; 
            }

            #video-zone { order: 1; padding: 10px; } /* Video bovenaan */
            #playlist { order: 2; border-top: 1px solid #333; } /* Lijst eronder */
            #sidebar { order: 3; border-top: 1px solid #333; } /* Bieb onderaan */

            .video-controls { flex-direction: column; }
            .skip-btn { padding: 15px; font-size: 1.2em; }
            
            .thumb { width: 60px; }
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body onmousemove="resetCursorTimer()">

<header>
    <div style="font-weight: 900; font-size: 1.2em;">K-POP <span style="color: var(--accent)">ARCHIVE</span></div>
    <div id="status" style="opacity:0.5; font-size:0.7em;">Multi-Device Mode</div>
</header>

<div class="main-container">
    <div id="sidebar">
        <p style="font-size:0.7em; opacity:0.5; margin-bottom:10px; text-transform: uppercase;">Bibliotheek</p>
        <div id="lib-lijst"></div>
        <div style="margin-top:20px">
            <label class="btn-upload"> + NIEUWE CSV <input type="file" id="csv-in" accept=".csv"></label>
        </div>
        <div id="skipped-sectie" style="margin-top:20px;">
            <p style="font-size:0.7em; opacity:0.5; text-transform: uppercase;">Gemist</p>
            <div id="skipped-lijst"></div>
        </div>
    </div>

    <div id="video-zone">
        <div class="video-box">
            <div id="player"></div>
            <div id="error-overlay">
                <h2 style="color: var(--error)">Oeps!</h2>
                <p>Video wordt overgeslagen...</p>
            </div>
        </div>
        <div class="video-controls">
            <div id="video-titel-veld">Kies een groep</div>
            <button class="skip-btn" onclick="speelVideo(currentIndex + 1)">VOLGENDE</button>
        </div>
    </div>
    
    <div id="playlist">
        <p style="font-size:0.7em; opacity:0.5; margin-bottom:10px; text-transform: uppercase;">Afspeellijst</p>
        <div id="v-lijst"></div>
    </div>
</div>

<script>
    let player;
    let playlist = [];
    let skippedVideos = [];
    let currentIndex = -1;
    let actieveGroep = "";
    let cursorTimer;
    let progressInterval;

    function resetCursorTimer() {
        document.body.classList.remove('hide-cursor');
        clearTimeout(cursorTimer);
        cursorTimer = setTimeout(() => { document.body.classList.add('hide-cursor'); }, 3000);
    }

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            events: { 
                'onStateChange': onPlayerStateChange,
                'onError': handlePlayerError 
            }
        });
        laadLib();
    }

    function startProgressTracking() {
        clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            if (player && player.getPlayerState() === YT.PlayerState.PLAYING) saveProgress();
        }, 5000);
    }

    function saveProgress() {
        if (!actieveGroep || currentIndex === -1) return;
        let p = JSON.parse(localStorage.getItem('kpop_pro_progress') || '{}');
        p[actieveGroep] = { index: currentIndex, time: Math.floor(player.getCurrentTime()) };
        localStorage.setItem('kpop_pro_progress', JSON.stringify(p));
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED) speelVideo(currentIndex + 1);
        if (event.data === YT.PlayerState.PLAYING) startProgressTracking();
        else clearInterval(progressInterval);
    }

    function handlePlayerError(e) {
        const video = playlist[currentIndex];
        if (video && !skippedVideos.find(v => v.Link === video.Link)) {
            skippedVideos.push(video); renderSkipped();
        }
        document.getElementById('error-overlay').style.display = 'flex';
        setTimeout(() => { document.getElementById('error-overlay').style.display = 'none'; speelVideo(currentIndex + 1); }, 2000);
    }

    function renderSkipped() {
        const div = document.getElementById('skipped-lijst'); div.innerHTML = '';
        skippedVideos.forEach(v => {
            const a = document.createElement('a'); a.className = 'lib-item';
            a.href = v.Link; a.target = '_blank'; a.style.textDecoration = 'none'; a.style.color = 'var(--error)';
            a.innerHTML = `<span>#${v.Nummer} ${v.Titel}</span>`;
            div.appendChild(a);
        });
    }

    document.getElementById('csv-in').addEventListener('change', function(e) {
        const file = e.target.files[0]; if(!file) return;
        Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: function(res) {
                const naam = file.name.replace('.csv', '');
                const data = res.data.sort((a,b) => (parseInt(a.Nummer)||0) - (parseInt(b.Nummer)||0));
                opslaan(naam, data); toonGroep(naam, data); e.target.value = '';
            }
        });
    });

    function opslaan(n, d) {
        let l = JSON.parse(localStorage.getItem('kpop_archive_final') || '{}');
        l[n] = d; localStorage.setItem('kpop_archive_final', JSON.stringify(l)); laadLib();
    }

    function laadLib() {
        const l = JSON.parse(localStorage.getItem('kpop_archive_final') || '{}');
        const div = document.getElementById('lib-lijst'); div.innerHTML = '';
        Object.keys(l).forEach(n => {
            const i = document.createElement('div');
            i.className = `lib-item ${n === actieveGroep ? 'active' : ''}`;
            i.innerHTML = `<span>${n}</span><span style="opacity:0.3" onclick="del(event,'${n}')">×</span>`;
            i.onclick = () => toonGroep(n, l[n]);
            div.appendChild(i);
        });
    }

    function del(e, n) {
        e.stopPropagation(); if(!confirm(`Verwijderen?`)) return;
        let l = JSON.parse(localStorage.getItem('kpop_archive_final') || '{}');
        delete l[n]; localStorage.setItem('kpop_archive_final', JSON.stringify(l));
        let p = JSON.parse(localStorage.getItem('kpop_pro_progress') || '{}');
        delete p[n]; localStorage.setItem('kpop_pro_progress', JSON.stringify(p));
        if(actieveGroep === n) resetScherm(); laadLib();
    }

    function resetScherm() {
        actieveGroep = ""; playlist = []; currentIndex = -1;
        document.getElementById('v-lijst').innerHTML = "";
        document.getElementById('video-titel-veld').innerText = "Laad een CSV...";
        if(player && player.stopVideo) player.stopVideo();
    }

    function toonGroep(n, d) {
        actieveGroep = n; playlist = d; tekenLijst(); laadLib();
        let p = JSON.parse(localStorage.getItem('kpop_pro_progress') || '{}');
        let saved = p[n] || { index: 0, time: 0 };
        speelVideo(saved.index, saved.time);
    }

    function tekenLijst() {
        const l = document.getElementById('v-lijst'); l.innerHTML = '';
        playlist.forEach((v, i) => {
            const id = extractId(v.Link);
            const d = document.createElement('div');
            d.className = `v-item ${i === currentIndex ? 'active' : ''}`;
            d.id = `v-${i}`;
            d.innerHTML = `<img class="thumb" src="https://img.youtube.com/vi/${id}/mqdefault.jpg"><div style="flex:1;overflow:hidden"><div>#${v.Nummer}</div><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v.Titel}</div></div>`;
            d.onclick = () => speelVideo(i);
            l.appendChild(d);
        });
    }

    function speelVideo(i, startTime = 0) {
        if (!playlist[i]) return;
        currentIndex = i;
        document.getElementById('video-titel-veld').innerText = playlist[i].Titel;
        const id = extractId(playlist[i].Link);
        if(player && player.loadVideoById) player.loadVideoById({ videoId: id, startSeconds: startTime });
        document.querySelectorAll('.v-item').forEach((el, idx) => { el.classList.toggle('active', idx === i); });
        const active = document.getElementById(`v-${i}`);
        if(active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function extractId(url) {
        const match = String(url).match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
        return match ? match[1] : url;
    }
</script>
</body>
</html>
