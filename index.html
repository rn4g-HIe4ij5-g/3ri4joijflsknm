<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Pop Archive</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ff4081">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --accent: #ff4081; --bg: #000000; --card: #121212; --text: #ffffff; --nav: #181818; }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text); margin: 0; 
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
            user-select: none;
        }

        /* HEADER */
        header { 
            padding: 40px 20px 10px; background: var(--bg); 
            text-align: center; flex-shrink: 0;
        }
        header h1 { font-size: 1.2rem; margin: 0; font-weight: 800; letter-spacing: 1px; color: var(--accent); }

        /* CONTENT AREA */
        .app-content { flex: 1; position: relative; overflow: hidden; }
        .view { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; flex-direction: column; padding: 15px; overflow-y: auto;
        }
        .view.active { display: flex; }

        /* VIDEO PLAYER (Zit in de 'Player' view) */
        .video-wrapper { 
            width: 100%; aspect-ratio: 16/9; background: #000; 
            border-radius: 12px; overflow: hidden; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .player-info { margin-top: 20px; text-align: center; }
        #video-titel-veld { font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; line-height: 1.4; }

        .skip-btn { 
            background: var(--accent); color: white; border: none; padding: 15px 40px; 
            border-radius: 30px; font-weight: bold; font-size: 1rem; width: 100%;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.3);
        }

        /* LIJSTEN (Library & Playlist) */
        .list-container { display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        .item-card { 
            background: var(--card); padding: 12px; border-radius: 10px; 
            display: flex; align-items: center; gap: 15px; border: 1px solid #222;
        }
        .item-card.active { border-color: var(--accent); background: #1a1014; }
        .item-thumb { width: 70px; aspect-ratio: 16/9; border-radius: 6px; object-fit: cover; }
        .item-text { flex: 1; overflow: hidden; }
        .item-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-meta { font-size: 0.75rem; opacity: 0.5; margin-bottom: 2px; }

        /* BOTTOM NAVIGATION */
        nav { 
            height: 70px; background: var(--nav); border-top: 1px solid #333;
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0;
        }
        .nav-btn { 
            display: flex; flex-direction: column; align-items: center; 
            color: #888; font-size: 0.7rem; gap: 5px; cursor: pointer;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-icon { font-size: 1.4rem; }

        /* UPLOAD BUTTON */
        .upload-floating {
            background: var(--accent); color: white; padding: 15px; 
            border-radius: 12px; text-align: center; font-weight: bold;
            margin-bottom: 20px;
        }

        #error-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: none; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; padding: 20px;
        }

        @media (min-width: 900px) {
            /* Desktop fix: laat alles naast elkaar zien zoals voorheen */
            body { flex-direction: row; }
            nav { width: 80px; height: 100vh; flex-direction: column; padding: 40px 0; }
            .view { position: relative; display: flex !important; width: 33.33%; border-right: 1px solid #222; }
            header { display: none; }
        }
    </style>
</head>
<body>

<header>
    <h1>K-POP ARCHIVE</h1>
</header>

<div class="app-content">
    <div id="view-lib" class="view active">
        <label class="upload-floating"> + NIEUWE CSV UPLOADEN <input type="file" id="csv-in" accept=".csv" style="display:none"></label>
        <div class="list-container" id="lib-lijst"></div>
    </div>

    <div id="view-player" class="view">
        <div class="video-wrapper">
            <div id="player"></div>
            <div id="error-overlay">
                <h3 style="color:var(--accent)">Geblokkeerd</h3>
                <p style="font-size:0.8rem">We skippen deze video...</p>
            </div>
        </div>
        <div class="player-info">
            <div id="video-titel-veld">Kies een nummer</div>
            <button class="skip-btn" onclick="speelVideo(currentIndex + 1)">VOLGENDE VIDEO</button>
        </div>
    </div>

    <div id="view-list" class="view">
        <div class="list-container" id="v-lijst"></div>
    </div>
</div>

<nav id="bottom-nav">
    <div class="nav-btn active" onclick="switchView('view-lib', this)">
        <span class="nav-icon">🗂</span><span>Bibliotheek</span>
    </div>
    <div class="nav-btn" onclick="switchView('view-player', this)">
        <span class="nav-icon">📺</span><span>Speler</span>
    </div>
    <div class="nav-btn" onclick="switchView('view-list', this)">
        <span class="nav-icon">🎶</span><span>Lijst</span>
    </div>
</nav>

<script>
    let player, playlist = [], currentIndex = -1, actieveGroep = "";

    // View switcher
    function switchView(viewId, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            events: { 
                'onStateChange': (e) => { if(e.data === YT.PlayerState.ENDED) speelVideo(currentIndex + 1); },
                'onError': handlePlayerError 
            }
        });
        laadLib();
    }

    function handlePlayerError() {
        document.getElementById('error-overlay').style.display = 'flex';
        setTimeout(() => { document.getElementById('error-overlay').style.display = 'none'; speelVideo(currentIndex + 1); }, 2000);
    }

    document.getElementById('csv-in').addEventListener('change', function(e) {
        const file = e.target.files[0]; if(!file) return;
        Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: function(res) {
                const naam = file.name.replace('.csv', '');
                const data = res.data.sort((a,b) => (parseInt(a.Nummer)||0) - (parseInt(b.Nummer)||0));
                opslaan(naam, data); toonGroep(naam, data);
            }
        });
    });

    function opslaan(n, d) {
        let l = JSON.parse(localStorage.getItem('kpop_archive_final') || '{}');
        l[n] = d; localStorage.setItem('kpop_archive_final', JSON.stringify(l)); laadLib();
    }

    function laadLib() {
        const l = JSON.parse(localStorage.getItem('kpop_archive_final') || '{}');
        const div = document.getElementById('lib-lijst'); div.innerHTML = '';
        Object.keys(l).forEach(n => {
            const card = document.createElement('div');
            card.className = `item-card ${n === actieveGroep ? 'active' : ''}`;
            card.innerHTML = `<div class="item-text"><div class="item-title">${n}</div></div><span onclick="del(event,'${n}')">🗑</span>`;
            card.onclick = () => toonGroep(n, l[n]);
            div.appendChild(card);
        });
    }

    function del(e, n) {
        e.stopPropagation(); if(!confirm(`Verwijderen?`)) return;
        let l = JSON.parse(localStorage.getItem('kpop_archive_final') || '{}');
        delete l[n]; localStorage.setItem('kpop_archive_final', JSON.stringify(l));
        laadLib();
    }

    function toonGroep(n, d) {
        actieveGroep = n; playlist = d; tekenLijst(); switchView('view-player', document.querySelectorAll('.nav-btn')[1]);
        let p = JSON.parse(localStorage.getItem('kpop_pro_progress') || '{}');
        let saved = p[n] || { index: 0, time: 0 };
        speelVideo(saved.index, saved.time);
    }

    function tekenLijst() {
        const l = document.getElementById('v-lijst'); l.innerHTML = '';
        playlist.forEach((v, i) => {
            const id = extractId(v.Link);
            const card = document.createElement('div');
            card.className = `item-card ${i === currentIndex ? 'active' : ''}`;
            card.innerHTML = `<img class="item-thumb" src="https://img.youtube.com/vi/${id}/mqdefault.jpg"><div class="item-text"><div class="item-meta">#${v.Nummer}</div><div class="item-title">${v.Titel}</div></div>`;
            card.onclick = () => speelVideo(i);
            l.appendChild(card);
        });
    }

    function speelVideo(i, startTime = 0) {
        if (!playlist[i]) return;
        currentIndex = i;
        document.getElementById('video-titel-veld').innerText = playlist[i].Titel;
        const id = extractId(playlist[i].Link);
        if(player && player.loadVideoById) player.loadVideoById({ videoId: id, startSeconds: startTime });
        
        // Save progress
        let p = JSON.parse(localStorage.getItem('kpop_pro_progress') || '{}');
        p[actieveGroep] = { index: i, time: 0 };
        localStorage.setItem('kpop_pro_progress', JSON.stringify(p));
        
        tekenLijst();
    }

    function extractId(url) {
        const match = String(url).match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
        return match ? match[1] : url;
    }
</script>
</body>
</html>
