<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Chrono</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="K-Chrono">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ff4081'/%3E%3Cpath d='M40 30l30 20-30 20V30z' fill='white'/%3E%3Cpath d='M30 70l10-5M70 30l-10 5' stroke='white' stroke-width='2' opacity='0.5'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23ff4081'/%3E%3Cpath d='M40 30l30 20-30 20V30z' fill='white'/%3E%3Cpath d='M30 70l10-5M70 30l-10 5' stroke='white' stroke-width='2' opacity='0.5'/%3E%3C/svg%3E">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --accent: #ff4081; --bg: #000000; --card: #121212; --text: #ffffff; --nav: #181818; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text); margin: 0; 
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column;
        }

        header { padding: 45px 20px 15px; background: var(--bg); text-align: center; flex-shrink: 0; }
        header h1 { font-size: 1.1rem; margin: 0; font-weight: 900; letter-spacing: 2px; color: var(--accent); }

        .app-content { flex: 1; position: relative; overflow: hidden; }
        .view { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; flex-direction: column; padding: 15px; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .view.active { display: flex; }

        .video-wrapper { 
            width: 100%; aspect-ratio: 16/9; background: #000; 
            border-radius: 16px; overflow: hidden; position: relative;
            box-shadow: 0 15px 35px rgba(255, 64, 129, 0.2);
        }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .player-info { margin-top: 25px; text-align: center; }
        #video-titel-veld { font-size: 1.2rem; font-weight: 700; margin-bottom: 25px; min-height: 3.4rem; display: flex; align-items: center; justify-content: center; }

        .skip-btn { 
            background: linear-gradient(45deg, #ff4081, #ff80ab); color: white; border: none; 
            padding: 18px; border-radius: 40px; font-weight: 800; font-size: 1rem; width: 100%;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .list-container { display: flex; flex-direction: column; gap: 12px; padding-bottom: 100px; }
        .item-card { 
            background: var(--card); padding: 10px; border-radius: 14px; 
            display: flex; align-items: center; gap: 12px; border: 1px solid #222;
            transition: transform 0.2s;
        }
        .item-card:active { transform: scale(0.97); }
        .item-card.active { border-color: var(--accent); background: #1a0a10; }
        .item-thumb { width: 85px; aspect-ratio: 16/9; border-radius: 8px; object-fit: cover; }
        .item-text { flex: 1; overflow: hidden; }
        .item-title { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-num { font-size: 0.7rem; font-weight: 800; color: var(--accent); margin-bottom: 2px; }

        nav { 
            height: 85px; background: rgba(24, 24, 24, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid #333; display: flex; justify-content: space-around; 
            padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0;
        }
        .nav-btn { 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #666; font-size: 0.65rem; gap: 6px; flex: 1;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-icon { font-size: 1.5rem; }

        .upload-floating {
            background: #222; color: white; padding: 15px; border-radius: 12px; 
            text-align: center; font-weight: bold; margin-bottom: 20px; border: 1px dashed var(--accent);
        }

        #error-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: none; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; z-index: 10;
        }

        @media (min-width: 900px) {
            body { flex-direction: row; }
            nav { width: 90px; height: 100vh; flex-direction: column; padding: 50px 0; border-top: none; border-right: 1px solid #333; }
            .view { position: relative; display: flex !important; width: 33.33%; border-right: 1px solid #222; }
            header { display: none; }
        }
    </style>
</head>
<body>

<header>
    <h1>K-CHRONO</h1>
</header>

<div class="app-content">
    <div id="view-lib" class="view active">
        <label class="upload-floating"> + VOEG NIEUWE GROEP TOE <input type="file" id="csv-in" accept=".csv" style="display:none"></label>
        <div class="list-container" id="lib-lijst"></div>
    </div>

    <div id="view-player" class="view">
        <div class="video-wrapper">
            <div id="player"></div>
            <div id="error-overlay">
                <h3 style="color:var(--accent)">GEBLOKKEERD</h3>
                <p style="font-size:0.8rem">Automatisch overslaan...</p>
            </div>
        </div>
        <div class="player-info">
            <div id="video-titel-veld">Geen video geselecteerd</div>
            <button class="skip-btn" onclick="speelVideo(currentIndex + 1)">VOLGENDE VIDEO</button>
        </div>
    </div>

    <div id="view-list" class="view">
        <div class="list-container" id="v-lijst"></div>
    </div>
</div>

<nav id="bottom-nav">
    <div class="nav-btn active" onclick="switchView('view-lib', this)">
        <span class="nav-icon">🏠</span><span>Home</span>
    </div>
    <div class="nav-btn" onclick="switchView('view-player', this)">
        <span class="nav-icon">▶️</span><span>Speler</span>
    </div>
    <div class="nav-btn" onclick="switchView('view-list', this)">
        <span class="nav-icon">📖</span><span>Lijst</span>
    </div>
</nav>

<script>
    let player, playlist = [], currentIndex = -1, actieveGroep = "";

    function switchView(viewId, btn) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            events: { 
                'onStateChange': (e) => { if(e.data === YT.PlayerState.ENDED) speelVideo(currentIndex + 1); },
                'onError': handlePlayerError 
            }
        });
        laadLib();
    }

    function handlePlayerError() {
        document.getElementById('error-overlay').style.display = 'flex';
        setTimeout(() => { document.getElementById('error-overlay').style.display = 'none'; speelVideo(currentIndex + 1); }, 2000);
    }

    document.getElementById('csv-in').addEventListener('change', function(e) {
        const file = e.target.files[0]; if(!file) return;
        Papa.parse(file, {
            header: true, skipEmptyLines: true,
            complete: function(res) {
                const naam = file.name.replace('.csv', '');
                const data = res.data.sort((a,b) => (parseInt(a.Nummer)||0) - (parseInt(b.Nummer)||0));
                opslaan(naam, data); toonGroep(naam, data);
            }
        });
    });

    function opslaan(n, d) {
        let l = JSON.parse(localStorage.getItem('kpop_archive_final') || '{}');
        l[n] = d; localStorage.setItem('kpop_archive_final', JSON.stringify(l)); laadLib();
    }

    function laadLib() {
        const l = JSON.parse(localStorage.getItem('kpop_archive_final') || '{}');
        const div = document.getElementById('lib-lijst'); div.innerHTML = '';
        Object.keys(l).forEach(n => {
            const card = document.createElement('div');
            card.className = `item-card ${n === actieveGroep ? 'active' : ''}`;
            card.innerHTML = `<div class="item-text"><div class="item-title">${n.toUpperCase()}</div></div><span style="opacity:0.3" onclick="del(event,'${n}')">🗑</span>`;
            card.onclick = () => toonGroep(n, l[n]);
            div.appendChild(card);
        });
    }

    function del(e, n) {
        e.stopPropagation(); if(!confirm(`Verwijderen uit bibliotheek?`)) return;
        let l = JSON.parse(localStorage.getItem('kpop_archive_final') || '{}');
        delete l[n]; localStorage.setItem('kpop_archive_final', JSON.stringify(l));
        laadLib();
    }

    function toonGroep(n, d) {
        actieveGroep = n; playlist = d; tekenLijst(); 
        switchView('view-player', document.querySelectorAll('.nav-btn')[1]);
        let p = JSON.parse(localStorage.getItem('kpop_pro_progress') || '{}');
        let saved = p[n] || { index: 0, time: 0 };
        speelVideo(saved.index, saved.time);
    }

    function tekenLijst() {
        const l = document.getElementById('v-lijst'); l.innerHTML = '';
        playlist.forEach((v, i) => {
            const id = extractId(v.Link);
            const card = document.createElement('div');
            card.className = `item-card ${i === currentIndex ? 'active' : ''}`;
            card.innerHTML = `<img class="item-thumb" src="https://img.youtube.com/vi/${id}/mqdefault.jpg"><div class="item-text"><div class="item-num">EPISODE ${v.Nummer}</div><div class="item-title">${v.Titel}</div></div>`;
            card.onclick = () => speelVideo(i);
            l.appendChild(card);
        });
    }

    function speelVideo(i, startTime = 0) {
        if (!playlist[i]) return;
        currentIndex = i;
        document.getElementById('video-titel-veld').innerText = playlist[i].Titel;
        const id = extractId(playlist[i].Link);
        if(player && player.loadVideoById) player.loadVideoById({ videoId: id, startSeconds: startTime });
        
        let p = JSON.parse(localStorage.getItem('kpop_pro_progress') || '{}');
        p[actieveGroep] = { index: i, time: 0 };
        localStorage.setItem('kpop_pro_progress', JSON.stringify(p));
        tekenLijst();
    }

    function extractId(url) {
        const match = String(url).match(/(?:v=|\/)([0-9A-Za-z_-]{11})/);
        return match ? match[1] : url;
    }
</script>
</body>
</html>
